<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Times Tables Practice (Hands Free)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background: #f4f4f9;
    }
    h1 { margin-bottom: 10px; }
    .tables { margin: 20px 0; }
    label { margin: 0 8px; }
    .hidden { display: none; }
    .question { font-size: 2em; margin: 20px 0; }
    .score { font-weight: bold; margin-top: 20px; }
    #wrongAnswers { margin-top: 20px; text-align: left; display: inline-block; }
    #wrongAnswers li { margin: 5px 0; color: red; }
    #voiceStatus { margin-top: 10px; font-style: italic; }
  </style>
</head>
<body>
  <h1>Times Tables Practice 🎤 (Hands Free)</h1>

  <div id="setup">
    <h3>Select tables:</h3>
    <div class="tables" id="tables"></div>

    <h3>Number of questions:</h3>
    <input type="number" id="numQuestions" value="10" min="1" max="144" />

    <br><br>
    <button onclick="startGame()">Start Practice</button>
  </div>

  <div id="quiz" class="hidden">
    <div class="question" id="question"></div>
    <div id="voiceStatus"></div>
    <div class="score" id="progress"></div>
  </div>

  <div id="result" class="hidden">
    <h2>All done!</h2>
    <p id="finalScore"></p>
    <h3>Questions you got wrong:</h3>
    <ul id="wrongAnswers"></ul>
    <button onclick="restart()">Try Again</button>
  </div>

  <script>
    // Build checkboxes for tables 1–12
    const tablesDiv = document.getElementById('tables');
    for (let i = 1; i <= 12; i++) {
      const label = document.createElement('label');
      label.innerHTML = `<input type="checkbox" value="${i}" checked> ${i}`;
      tablesDiv.appendChild(label);
    }

    let selectedTables = [];
    let numQuestions = 10;
    let questions = [];
    let current = 0;
    let score = 0;
    let wrongAnswers = [];
    let recognition;

    function startGame() {
      selectedTables = Array.from(document.querySelectorAll('#tables input:checked')).map(cb => parseInt(cb.value));
      numQuestions = parseInt(document.getElementById('numQuestions').value);

      if (selectedTables.length === 0) {
        alert('Please select at least one table.');
        return;
      }

      // Build pool of questions
      let pool = [];
      for (let a of selectedTables) {
        for (let b = 1; b <= 12; b++) {
          if (selectedTables.includes(b)) {
            if (a <= b) {
              pool.push({a, b, answer: a * b});
            }
          } else {
            pool.push({a, b, answer: a * b});
          }
        }
      }

      pool = pool.sort(() => Math.random() - 0.5);
      questions = pool.slice(0, numQuestions);

      current = 0;
      score = 0;
      wrongAnswers = [];

      document.getElementById('setup').classList.add('hidden');
      document.getElementById('quiz').classList.remove('hidden');
      showQuestion();
    }

    function showQuestion() {
      const q = questions[current];
      const flip = Math.random() < 0.5;
      q.displayA = flip ? q.a : q.b;
      q.displayB = flip ? q.b : q.a;

      const questionText = `${q.displayA} × ${q.displayB}`;
      document.getElementById('question').innerText = `${questionText} = ?`;
      document.getElementById('progress').innerText = `Question ${current+1} of ${numQuestions} | Score: ${score}`;
      document.getElementById('voiceStatus').innerText = "🎙️ Listening...";

      // Speak the question
      speak(`What is ${q.displayA} times ${q.displayB}?`, () => {
        startVoice();
      });
    }

    function submitAnswer(userAnswer) {
      const q = questions[current];

      if (!isNaN(userAnswer) && userAnswer === q.answer) {
        score++;
      } else {
        wrongAnswers.push({
          a: q.displayA,
          b: q.displayB,
          correct: q.answer,
          given: isNaN(userAnswer) ? "blank" : userAnswer
        });
      }

      current++;
      if (current < numQuestions) {
        showQuestion();
      } else {
        endGame();
      }
    }

    function endGame() {
      document.getElementById('quiz').classList.add('hidden');
      document.getElementById('result').classList.remove('hidden');
      document.getElementById('finalScore').innerText = `You scored ${score} out of ${numQuestions}.`;

      const list = document.getElementById('wrongAnswers');
      list.innerHTML = "";
      if (wrongAnswers.length === 0) {
        list.innerHTML = "<li>None 🎉</li>";
      } else {
        wrongAnswers.forEach(item => {
          list.innerHTML += `<li>${item.a} × ${item.b} = ${item.correct} (you answered: ${item.given})</li>`;
        });
      }

      speak(`All done! You scored ${score} out of ${numQuestions}.`);
    }

    function restart() {
      document.getElementById('result').classList.add('hidden');
      document.getElementById('setup').classList.remove('hidden');
    }

    // 🎤 Voice Recognition (Web Speech API)
    function startVoice() {
      if (!('webkitSpeechRecognition' in window)) {
        alert("Sorry, your browser doesn’t support speech recognition.");
        return;
      }

      if (recognition) recognition.stop();
      recognition = new webkitSpeechRecognition();
      recognition.lang = "en-US";
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.start();

      recognition.onresult = function(event) {
        const transcript = event.results[0][0].transcript.trim();
        const number = parseInt(transcript);
        document.getElementById('voiceStatus').innerText = `You said: "${transcript}"`;
        submitAnswer(number);
      };

      recognition.onerror = function() {
        document.getElementById('voiceStatus').innerText = "⚠️ Couldn’t understand, try again.";
        // Try again automatically
        startVoice();
      };
    }

    // 🔊 Text-to-speech
    function speak(text, callback) {
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "en-US";
      utter.onend = callback;
      speechSynthesis.speak(utter);
    }
  </script>
</body>
</html>
